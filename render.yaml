services:
  - type: web
    name: kamikaze-ia
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FAL_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_IMAGE_MODEL
        value: fal-ai/flux/dev
      - key: FAL_VIDEO_MODEL
        value: fal-ai/kling-video/v2.1/standard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
